version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0

executors:
  docker-python:
    docker:
      - image: cimg/python:3.7
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    environment:
      AWS_PAGER: ""

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - run:
          name: Show assumed identity
          command: aws sts get-caller-identity --profile default
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  install-aws-cli:
    description: "Installs AWS CLI v2"
    steps:
      - run:
          name: Install AWS CLI
          command: |
            apt-get update && apt-get install -y unzip
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            ./aws/install
            aws --version
  remove-lambda:
    description: "Removes API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - install-aws-cli
      - run:
          name: Empty deployment bucket
          command: |
            status=$(aws cloudformation describe-stacks --region eu-west-2 \
              --stack-name academy-api-<<parameters.stage>> \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo GONE)
            if [ "$status" = GONE ] || [ "$status" = DELETE_IN_PROGRESS ]; then
              echo "Stack academy-api-<<parameters.stage>> is ${status}; skipping"
              exit 0
            fi
            bucket=$(aws cloudformation describe-stack-resource --region eu-west-2 \
              --stack-name academy-api-<<parameters.stage>> \
              --logical-resource-id ServerlessDeploymentBucket \
              --query StackResourceDetail.PhysicalResourceId --output text)
            aws s3 rm "s3://${bucket}" --recursive --region eu-west-2
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | bash -
            apt-get update && apt-get install -y nodejs
      - run:
          name: Install serverless CLI
          command: npm i -g serverless
      - run:
          name: Remove lambda
          no_output_timeout: 60m
          command: |
            status=$(aws cloudformation describe-stacks --region eu-west-2 \
              --stack-name academy-api-<<parameters.stage>> \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo GONE)
            case "$status" in
              GONE)
                echo "Stack academy-api-<<parameters.stage>> already deleted; skipping"
                exit 0
                ;;
              DELETE_IN_PROGRESS)
                echo "Stack academy-api-<<parameters.stage>> is already deleting; waiting"
                aws cloudformation wait stack-delete-complete --region eu-west-2 \
                  --stack-name academy-api-<<parameters.stage>>
                exit 0
                ;;
            esac
            cd ./AcademyApi/
            sls remove --stage <<parameters.stage>>
  delete-ssm-parameters:
    description: "Deletes API SSM parameters"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - install-aws-cli
      - run:
          name: Delete SSM parameters
          command: |
            aws ssm delete-parameters --region eu-west-2 --output json --names \
              "/academy-api/<<parameters.stage>>/academy-api-key" \
              "/academy-api/<<parameters.stage>>/db-hostname" \
              "/academy-api/<<parameters.stage>>/db-port" \
              "/academy-api/<<parameters.stage>>/db-database" \
              "/academy-api/<<parameters.stage>>/db-username" \
              "/academy-api/<<parameters.stage>>/db-password" \
              "/academy-api/<<parameters.stage>>/alerts-email"

jobs:
  assume-role-staging:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_STAGING
  assume-role-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION
  remove-staging:
    executor: docker-dotnet
    steps:
      - remove-lambda:
          stage: "staging"
  remove-production:
    executor: docker-dotnet
    steps:
      - remove-lambda:
          stage: "production"
  delete-ssm-staging:
    executor: docker-dotnet
    steps:
      - delete-ssm-parameters:
          stage: "staging"
  delete-ssm-production:
    executor: docker-dotnet
    steps:
      - delete-ssm-parameters:
          stage: "production"

workflows:
  decommission:
    jobs:
       - permit-staging-removal:
           type: approval
       - assume-role-staging:
           context: aws-academy-terraform-staging-context
           requires:
               - permit-staging-removal
       - remove-staging:
           context: 
            - "Serverless Framework"
           requires:
             - assume-role-staging
       - delete-ssm-staging:
           requires:
             - remove-staging
       - permit-production-removal:
           type: approval
           requires:
             - delete-ssm-staging
       - assume-role-production:
           context: aws-academy-terraform-production-context
           requires:
               - permit-production-removal
       - remove-production:
           context: 
            - "Serverless Framework"
           requires:
             - assume-role-production
       - delete-ssm-production:
           requires:
             - remove-production
